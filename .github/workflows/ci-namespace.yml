#Namespace run
name: ci-namespace

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: namespace-profile-plant-sensor
    outputs:
      image: ${{ steps.name.outputs.image }} #Lets later jobs read the image
    steps:
      - uses: actions/checkout@v4 #Clone repo to image
    #unique tag per commit, so the job only uses the image built in this run
      - id: name
        run: echo "image=ghcr.io/${{ github.repository_owner }}/plant-sensor-ci:${{ github.sha }}" >> "$GITHUB_OUTPUT"
        #point docker buildx to the namespace remote builder
      - uses: namespacelabs/nscloud-setup-buildx-action@v0
      #login to GHCR with the token github gives every run (thus no secret)
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6 
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.name.outputs.image }}

  erc:
    needs: image
    runs-on: namespace-profile-plant-sensor
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4 #Clone repo to image
      - run: make erc #kicad-cli sch erc ( ERC check)
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: erc-report, path: results/erc.rpt} #saves as an artifact

  export: #Fresh machine
    needs: [image, erc] #Waits on the previous job
    runs-on: namespace-profile-plant-sensor
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: make export # writes the netlist, BOM CSV and PDF, and uploads them as the exports artifact
      - uses: actions/upload-artifact@v4
        with: {name: exports, path: exports/}
  sim: #third machine
    needs: [image, export] #Waits on the previous workflow
    runs-on: namespace-profile-plant-sensor
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: exports, path: exports} #Downloads the BOM, CSV and PDF
      - name: 27 corners (serial) #27 corners (MAKEFILE)
        run: make corners PY=python3 && cat results/corners.md >> "$GITHUB_STEP_SUMMARY"
      - name: 2000-run Monte Carlo (serial shards, all cores of this one runner)
        run: make mc PY=python3  #Montecarlo (MAKEFILE)
      - name: Report
        if: always()
        run: make report PY=python3 #Report (MAKEFILE)
      - if: always()
        uses: actions/upload-artifact@v4 #Upload the sim-results / report
        with: {name: sim-results, path: results/}
